site_name: Java 面试知识库
site_description: Java、Spring、JVM、并发、设计模式与 AI 工程化面试知识整理
site_url: https://tcming.github.io/seeking/
repo_url: https://github.com/TCMING/seeking
repo_name: TCMING/seeking

docs_dir: .mkdocs/docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: blue

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

exclude_docs: |
  .gitkeep

